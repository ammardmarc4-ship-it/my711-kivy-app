name: Build Smart Finder APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'


    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-libav \
          libgstreamer-plugins-base1.0-dev \
          unzip \
          zip \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer

    - name: Pre-accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # إنشاء مجلد وقبول التراخيص من خلال المحاكاة التلقائية لأمر الموافقة (yes)
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo -e "244d2d049b721471d6565b546cd97a2e60e47069\n28e21781844319113ab0dfde43253d04cd0057be\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb74313026e2281d0b3d\n2660171561b9a8d56b6a3b2d1c98115e7c1f0679\n84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Run Buildozer
      run: |
        # تفعيل متغير البيئة لإجبار buildozer على قبول ترخيص أندرويد تلقائياً
        export BUILDOZER_ACCEPT_ANDROID_SDK_LICENSE=1
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartFinder-APK
        path: bin/*.apk
