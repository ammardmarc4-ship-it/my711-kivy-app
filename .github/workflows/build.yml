name: Build Smart Finder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev cmake gettext

      - name: Set Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Wipe Old Environment (Start From Zero)
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer/
          rm -rf ~/.android

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.0.0" buildozer

      - name: Force Accept All Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # حقن الموافقة المسبقة على تراخيص SDK 37 في النظام مباشرة
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "247a1c17b3447d98b30e45e722209b391f898a46\n28620e9826e8fb6137434c46f52a77a943a41224\n893a30fcc98b263673d44e651b58240d4c06041c" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build APK
        run: |
          export BUILDOZER_ALLOW_KIVY_NEW_DESIGN=1
          # تعديل ملف الإعدادات إلكترونياً لقبول الترخيص مجدداً
          sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec || true
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec || true
          
          # فرض الإجابة بنعم على أي سؤال برامجي أثناء التجميع
          yes y | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-finder-apk
          path: bin/*.apk
          if-no-files-found: error
