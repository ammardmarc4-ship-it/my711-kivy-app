name: Build Smart Finder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-dev \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.36"
          python -m pip install "buildozer==1.5.0"

      - name: Check Project Files
        run: |
          echo "=== Project Files ==="
          ls -la
          echo "=== Buildozer Spec ==="
          test -f buildozer.spec && echo "buildozer.spec found" || exit 1

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: List APK Files
        if: always()
        run: |
          echo "=== APK Files ==="
          find bin -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-finder-apk
          path: bin/*.apk
          if-no-files-found: error
